[workspace]
resolver = "3"
members = ["crates/core", "crates/server", "crates/agent", "crates/wgate"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/xmiksay/wgate"

[workspace.dependencies]
wgate-core = { path = "crates/core" }
wgate-server = { path = "crates/server" }
wgate-agent = { path = "crates/agent" }

anyhow = "1"
ipnet = "2.12"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
